<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="title desc">
<title id="title">Energy, life and intelligence</title>
<desc id="desc">A hand-drawn ink illustration showing sunlight reaching Earth, energy flowing through simple living forms, and the emergence of a brain-like mind.</desc>
<rect width="900" height="620" fill="#fff"/>
<g fill="#111" font-family="Georgia,serif" text-anchor="middle">
 <text x="450" y="72" font-size="42" font-weight="bold">energy, life &amp; intelligence</text>
 <path d="M190 88 Q330 96 450 88 T710 89" fill="none" stroke="#111" stroke-width="2.4" stroke-linecap="round"/>
 <text x="450" y="122" font-size="18">could the search for energy help explain the rise of intelligence?</text>
</g>
<g fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round">
